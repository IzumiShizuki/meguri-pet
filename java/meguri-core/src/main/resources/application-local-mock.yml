spring:
  config:
    activate:
      on-profile: local-mock
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

meguri:
  llm:
    provider: mock
  web-search:
    enabled: false
  weather:
    enabled: ${MEGURI_WEATHER_ENABLED:true}
  sleep-memory:
    enabled: ${MEGURI_SLEEP_MEMORY_CONSOLIDATION_ENABLED:false}
  memory:
    bridge-token: ${MEGURI_INTERNAL_BRIDGE_TOKEN:}
