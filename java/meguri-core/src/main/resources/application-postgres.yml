spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${MEGURI_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/meguri}
    username: ${MEGURI_POSTGRES_USER:meguri}
    password: ${MEGURI_POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${MEGURI_POSTGRES_POOL_SIZE:8}
      minimum-idle: ${MEGURI_POSTGRES_MIN_IDLE:1}
      connection-timeout: ${MEGURI_POSTGRES_CONNECT_TIMEOUT_MS:5000}

meguri:
  turn-journal:
    mode: postgres
