spring:
  application:
    name: meguri-core-java
  profiles:
    default: local-mock
  main:
    web-application-type: reactive

server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful

meguri:
  build-id: ${MEGURI_BUILD_ID:}
  data-root: ${MEGURI_DATA_ROOT:../../datasets/meguri}
  rag-path: ${MEGURI_RAG_PATH:../../datasets/meguri/exports/rag/chunks_train.jsonl}
  memory:
    bridge-url: ${MEGURI_MEMORY_BRIDGE_URL:http://127.0.0.1:8000}
    bridge-token: ${MEGURI_INTERNAL_BRIDGE_TOKEN:}
    timeout-ms: ${MEGURI_MEMORY_TIMEOUT_MS:1500}
  web-search:
    enabled: ${MEGURI_WEB_SEARCH_ENABLED:false}
    base-url: ${MEGURI_WEB_SEARCH_BASE_URL:https://www.bing.com/search}
    timeout-ms: ${MEGURI_WEB_SEARCH_TIMEOUT_MS:8000}
    max-results: ${MEGURI_WEB_SEARCH_MAX_RESULTS:5}
  weather:
    enabled: ${MEGURI_WEATHER_ENABLED:false}
    base-url: ${MEGURI_WEATHER_BASE_URL:https://api.open-meteo.com/v1/forecast}
    location-file: ${MEGURI_WEATHER_LOCATION_FILE:${user.home}/.meguri/weather-location.json}
    location-name: ${MEGURI_WEATHER_LOCATION_NAME:上海}
    latitude: ${MEGURI_WEATHER_LATITUDE:31.2304}
    longitude: ${MEGURI_WEATHER_LONGITUDE:121.4737}
    timezone: ${MEGURI_WEATHER_TIMEZONE:Asia/Shanghai}
    poll-delay-ms: ${MEGURI_WEATHER_POLL_DELAY_MS:900000}
    rain-probability-threshold: ${MEGURI_WEATHER_RAIN_THRESHOLD:50}
    rain-lookahead-hours: ${MEGURI_WEATHER_RAIN_LOOKAHEAD_HOURS:2}
  sleep-memory:
    enabled: ${MEGURI_SLEEP_MEMORY_CONSOLIDATION_ENABLED:false}
    timezone: ${MEGURI_SLEEP_MEMORY_TIMEZONE:Asia/Shanghai}
    hour: ${MEGURI_SLEEP_MEMORY_HOUR:2}
    min-messages: ${MEGURI_SLEEP_MEMORY_MIN_MESSAGES:4}
    check-delay-ms: ${MEGURI_SLEEP_MEMORY_CHECK_DELAY_MS:60000}
  billing-digest:
    file: ${MEGURI_BILLING_DIGEST_FILE:D:/program/shizuki-site/data/qianji-sync/daily-billing-digest.json}
    project-root: ${MEGURI_BILLING_REPORT_PROJECT_ROOT:D:/program/meguri-pet}
  llm:
    provider: ${MEGURI_LLM_PROVIDER:mock}
    base-url: ${MEGURI_LLM_BASE_URL:}
    model: ${MEGURI_LLM_MODEL:}
    api-key-file: ${MEGURI_LLM_API_KEY_FILE:}
    response-format: ${MEGURI_LLM_RESPONSE_FORMAT:json_schema}
    max-concurrency: ${MEGURI_LLM_MAX_CONCURRENCY:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# No LangChain4j OpenAI properties are present in the default profile.  This
# keeps local startup offline-first; the runtime may inject its mock provider.
# Enable the `openai` profile and provide credentials to create a real model.
