<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meguri Desktop Pet</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 70% 10%, #5b426e 0, #241d36 45%, #100e1b 100%); color: #f8eef9; }
    .shell { width: min(1120px, 100%); min-height: 100vh; margin: 0 auto; padding: 28px; display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(360px, 1.1fr); gap: 24px; align-items: center; }
    .stage, .chat { border: 1px solid #ffffff20; border-radius: 28px; background: #171323cc; box-shadow: 0 24px 90px #0007; backdrop-filter: blur(18px); }
    .stage { min-height: 680px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; position: relative; }
    .brand { width: 100%; display: flex; justify-content: space-between; align-items: center; color: #e8c8ec; }
    .brand strong { font-size: 1.1rem; letter-spacing: .08em; }
    .status { font-size: .78rem; color: #b9efcd; border: 1px solid #b9efcd55; border-radius: 999px; padding: 6px 10px; }
    .status.busy { color: #f8d694; border-color: #f8d69466; }
    .sprite-wrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 18px 0; }
    #sprite { max-width: 100%; max-height: 500px; object-fit: contain; filter: drop-shadow(0 24px 20px #0008); }
    .expression { color: #d4b9db; font-size: .9rem; min-height: 24px; }
    .chat { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .chat.dragging-resource { border-color: #87c7ff99; box-shadow: 0 0 0 4px #87c7ff22, 0 24px 90px #0007; }
    h1 { margin: 0; font-size: clamp(1.7rem, 3vw, 2.5rem); }
    .subtitle { margin: 0; color: #c6b8d2; line-height: 1.65; }
    .weather-card { padding: 12px 14px; border-radius: 16px; background: #7fb9ff12; border: 1px solid #9bc8ff2c; color: #d9eaff; font-size: .86rem; line-height: 1.6; }
    .weather-card summary { cursor: pointer; color: #afcaed; margin-top: 6px; }
    .weather-fields { display: grid; grid-template-columns: 1.2fr .8fr .8fr 1fr auto; gap: 6px; margin-top: 8px; }
    .weather-fields input { padding: 8px; font-size: .78rem; }
    .weather-fields button { padding: 0 12px; font-size: .78rem; }
    .session-settings { padding: 10px 14px; border: 1px solid #ffffff1c; border-radius: 12px; color: #d9d0e4; font-size: .82rem; }
    .session-settings summary { cursor: pointer; color: #bcdcff; }
    .session-fields { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; align-items: center; margin-top: 12px; }
    .session-fields label { display: contents; }
    .session-fields input[type="range"] { width: 130px; padding: 0; accent-color: #87c7ff; }
    .session-fields input[type="checkbox"] { justify-self: end; accent-color: #87c7ff; }
    .session-value { min-width: 46px; color: #87c7ff; text-align: right; }
    .training-settings { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px solid #ffffff1c; border-radius: 12px; color: #d9d0e4; font-size: .82rem; }
    .training-settings label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .training-settings input { flex: none; min-width: auto; accent-color: #87c7ff; }
    .training-note { color: #9386a1; text-align: right; }
    .bubble { min-height: 180px; padding: 18px; border-radius: 20px; background: #ffffff0b; border: 1px solid #ffffff14; line-height: 1.8; white-space: pre-wrap; }
    .training-candidates { display: grid; gap: 10px; }
    .training-candidates[hidden], .training-feedback[hidden] { display: none; }
    .candidate-option { padding: 12px 14px; border: 1px solid #ffffff1c; border-radius: 14px; background: #ffffff08; color: inherit; text-align: left; font-weight: 400; white-space: pre-wrap; }
    .candidate-option.selected { border-color: #87c7ff; background: #7fb9ff18; }
    .candidate-label { display: block; margin-bottom: 6px; color: #87c7ff; font-size: .78rem; }
    .training-feedback { display: grid; gap: 8px; }
    .training-feedback textarea { width: 100%; min-height: 82px; resize: vertical; border: 1px solid #ffffff25; background: #0b0913aa; border-radius: 14px; padding: 12px; color: inherit; outline: none; font: inherit; }
    .training-feedback textarea:focus { border-color: #df9ce8; box-shadow: 0 0 0 3px #df9ce822; }
    .training-feedback-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .training-feedback-actions button { min-height: 38px; }
    .training-feedback-status { min-height: 20px; color: #b9efcd; font-size: .8rem; }
    .artifact-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; white-space: normal; }
    .artifact-links a { color: #87c7ff; text-decoration: underline; text-underline-offset: 3px; }
    .artifact-bubbles { position: absolute; right: 20px; top: 92px; display: flex; flex-direction: column; gap: 12px; z-index: 6; }
    .artifact-bubble { position: relative; width: 58px; height: 58px; border-radius: 50%; background: #241d36f2; border: 1px solid #87c7ff66; box-shadow: 0 10px 26px #000a; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; animation: bubble-pop .35s cubic-bezier(.34, 1.56, .64, 1); }
    .artifact-bubble:hover { border-color: #b9e0ff; box-shadow: 0 10px 30px #000c, 0 0 0 4px #87c7ff22; }
    .artifact-bubble img { width: 32px; height: 32px; pointer-events: none; }
    .artifact-bubble .ext-badge { color: #d9eaff; font-size: .64rem; font-weight: 700; letter-spacing: .04em; pointer-events: none; }
    .artifact-bubble .bubble-close { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; background: #443355; color: #ffd3d3; border: 1px solid #ffffff33; font-size: .7rem; line-height: 1; display: none; align-items: center; justify-content: center; padding: 0; }
    .artifact-bubble:hover .bubble-close { display: flex; }
    @keyframes bubble-pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .chat-log { border: 1px solid #ffffff1c; border-radius: 12px; padding: 8px 14px; color: #d9d0e4; font-size: .84rem; }
    .chat-log summary { cursor: pointer; color: #bcdcff; }
    .chat-log-list { display: grid; gap: 8px; max-height: 240px; overflow: auto; margin-top: 10px; }
    .log-entry { display: grid; gap: 3px; padding: 8px 10px; border-radius: 10px; background: #ffffff08; border: 1px solid #ffffff12; }
    .log-entry.user { border-color: #a873e24d; }
    .log-entry.file { border-color: #87c7ff4d; background: #7fb9ff10; }
    .log-meta { display: flex; justify-content: space-between; gap: 10px; color: #9386a1; font-size: .7rem; }
    .log-text { white-space: pre-wrap; line-height: 1.55; word-break: break-word; }
    .log-entry .artifact-links { margin-top: 4px; }
    .resource-panel { display: grid; gap: 9px; padding: 12px 14px; border: 1px solid #87c7ff42; border-radius: 14px; background: #7fb9ff0c; }
    .resource-panel[hidden] { display: none; }
    .resource-heading { display: flex; justify-content: space-between; gap: 12px; color: #bcdcff; font-size: .82rem; }
    .resource-hint { color: #9386a1; text-align: right; }
    .resource-list { display: grid; gap: 7px; max-height: 220px; overflow: auto; }
    .resource-candidate { display: grid; gap: 3px; width: 100%; padding: 10px 12px; background: #ffffff0a; border: 1px solid #ffffff1c; color: #eee5f3; text-align: left; font-weight: 400; }
    .resource-candidate-name { color: #bcdcff; }
    .resource-candidate-path { overflow: hidden; color: #9386a1; font-size: .74rem; text-overflow: ellipsis; white-space: nowrap; }
    .resource-selected { display: flex; flex-wrap: wrap; gap: 7px; }
    .resource-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid #87c7ff42; border-radius: 999px; color: #d9eaff; font-size: .76rem; }
    .resource-chip button { min-height: auto; padding: 0 4px; background: transparent; color: #ffb4b4; }
    form { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; border: 1px solid #ffffff25; background: #0b0913aa; border-radius: 14px; padding: 14px; color: inherit; outline: none; font: inherit; }
    input:focus { border-color: #df9ce8; box-shadow: 0 0 0 3px #df9ce822; }
    button { border: 0; border-radius: 14px; padding: 0 20px; background: linear-gradient(135deg, #e7a5ec, #a873e2); color: #1a1020; font-weight: 700; cursor: pointer; font: inherit; }
    button:disabled { opacity: .5; cursor: wait; }
    button.secondary { background: #ffffff14; color: #eadff0; border: 1px solid #ffffff2a; }
    .meta { display: flex; justify-content: space-between; color: #9386a1; font-size: .76rem; gap: 12px; }
    .error { color: #ffb4b4; min-height: 22px; font-size: .84rem; }
    body.overlay { background: transparent; }
    body.overlay .shell { width: 100%; min-height: 100vh; padding: 10px; display: block; }
    body.overlay .stage { min-height: 365px; height: 365px; padding: 12px; border-radius: 24px; background: #171323dd; }
    body.overlay #sprite { max-height: 275px; }
    body.overlay .chat { margin-top: 10px; padding: 12px; gap: 8px; border-radius: 18px; }
    body.overlay .chat > div:first-child, body.overlay .meta { display: none; }
    body.overlay .weather-card details { display: none; }
    body.overlay .session-settings { display: none; }
    body.overlay .training-settings, body.overlay .training-candidates, body.overlay .training-feedback, body.overlay .resource-panel { display: none !important; }
    body.overlay .bubble { min-height: 48px; max-height: 110px; overflow: auto; padding: 10px; font-size: .86rem; }
    body.overlay .artifact-bubbles { right: 12px; top: 64px; gap: 9px; }
    body.overlay .artifact-bubble { width: 46px; height: 46px; }
    body.overlay .artifact-bubble img { width: 26px; height: 26px; }
    body.overlay .chat-log { padding: 6px 10px; font-size: .8rem; }
    body.overlay .chat-log-list { max-height: 130px; }
    body.overlay form { gap: 6px; }
    body.overlay input { padding: 9px; font-size: .84rem; }
    body.overlay button { padding: 0 12px; font-size: .84rem; }
    @media (max-width: 800px) { .shell { grid-template-columns: 1fr; padding: 14px; } .stage { min-height: 480px; } #sprite { max-height: 330px; } .weather-fields { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="Meguri desktop pet">
      <div class="brand"><strong>MEGURI</strong><span id="status" class="status">Java runtime connecting…</span></div>
      <div class="sprite-wrap"><img id="sprite" src="/assets/sprites/meguri/ce04001l.png" alt="Meguri" /></div>
      <div id="artifact-bubbles" class="artifact-bubbles" aria-label="新生成的文件" aria-live="polite"></div>
      <div id="expression" class="expression">neutral · low</div>
    </section>
    <section class="chat">
      <div>
        <h1>和 Meguri 说说话</h1>
        <p class="subtitle">这是本地桌宠主页。浏览器只访问 Java Meguri Core，DeepSeek key 保留在本机服务端。</p>
      </div>
      <div class="weather-card">
        <div id="weather-text">天气：正在读取已保存地点…</div>
        <details>
          <summary>修改天气地点</summary>
          <form id="weather-form" class="weather-fields">
            <input id="weather-name" aria-label="地点名称" placeholder="地点名称" maxlength="40" required />
            <input id="weather-latitude" aria-label="纬度" type="number" min="-90" max="90" step="0.0001" placeholder="纬度" required />
            <input id="weather-longitude" aria-label="经度" type="number" min="-180" max="180" step="0.0001" placeholder="经度" required />
            <input id="weather-timezone" aria-label="时区" placeholder="Asia/Shanghai" required />
            <button type="submit">保存</button>
          </form>
        </details>
      </div>
      <details class="session-settings">
        <summary>Conversation segmentation</summary>
        <div class="session-fields">
          <label><span>Automatic idle segmentation</span><input id="session-auto" type="checkbox" /></label>
          <label><span>Idle threshold</span><input id="session-idle" type="range" min="1" max="120" step="1" /></label><span id="session-idle-value" class="session-value"></span>
          <label><span>Candidate user turns</span><input id="session-turns" type="range" min="2" max="6" step="1" /></label><span id="session-turns-value" class="session-value"></span>
          <label><span>New-topic confidence</span><input id="session-confidence" type="range" min="50" max="95" step="5" /></label><span id="session-confidence-value" class="session-value"></span>
        </div>
      </details>
      <div class="training-settings">
        <label><input id="training-mode" type="checkbox" />主动学习模式</label>
        <span id="training-note" class="training-note">双回答概率 0.1%，反馈框隐藏</span>
      </div>
      <div id="bubble" class="bubble">你好呀，我已经在这里等你了。</div>
      <details id="chat-log-panel" class="chat-log">
        <summary>聊天记录 <span id="chat-log-count"></span></summary>
        <div id="chat-log-list" class="chat-log-list" aria-live="polite"></div>
      </details>
      <div id="training-candidates" class="training-candidates" hidden></div>
      <div id="training-feedback" class="training-feedback" hidden>
        <textarea id="training-feedback-text" maxlength="2000" placeholder="这次回应哪里不合适？例如：这里应该先严肃制止，再表达关心。"></textarea>
        <div class="training-feedback-actions">
          <button id="training-feedback-submit" type="button">保存为训练候选</button>
        </div>
        <div id="training-feedback-status" class="training-feedback-status" aria-live="polite"></div>
      </div>
      <div id="resource-panel" class="resource-panel" hidden>
        <div class="resource-heading"><strong>本地资源引用</strong><span id="resource-hint" class="resource-hint"></span></div>
        <div id="resource-list" class="resource-list"></div>
        <div id="resource-selected" class="resource-selected" aria-label="已选择的本地资源"></div>
      </div>
      <form id="form">
        <input id="message" autocomplete="off" placeholder="输入消息；@文件名 引用本地资源，#帮助 查看快捷指令…" maxlength="8000" />
        <button id="send" type="submit">发送</button>
        <button id="send-draft" class="secondary" type="button" hidden>发送草稿</button>
      </form>
      <div id="error" class="error"></div>
      <div class="meta"><span id="build">build: checking…</span><span>session: local-browser</span></div>
    </section>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('mode') === 'overlay') document.body.classList.add('overlay')
    // The renderer talks only to the loopback desktop gateway. Bearer credentials
    // stay in the Node process and are injected into the upstream request there.
    const coreUrl = '/core'
    // Everything 资源搜索只能在本机完成：远端 Core 在 Linux 上，看不到本地文件。
    const localCoreUrl = '/core'
    const sessionStorageKey = 'meguri.desktop.sessionId'
    const sessionSettingsKey = 'meguri.desktop.sessionSettings'
    const trainingModeKey = 'meguri.desktop.trainingMode'
    const lastTurnAtKey = 'meguri.desktop.lastTurnAt'
    function newSessionId() { return 'desktop-home-' + crypto.randomUUID() }
    let sessionId = localStorage.getItem(sessionStorageKey) || newSessionId()
    localStorage.setItem(sessionStorageKey, sessionId)
    const userId = 'local-airi-user'
    const sprite = document.getElementById('sprite')
    const expression = document.getElementById('expression')
    const bubble = document.getElementById('bubble')
    const status = document.getElementById('status')
    const build = document.getElementById('build')
    const sessionLabel = document.querySelector('.meta span:last-child')
    const error = document.getElementById('error')
    const input = document.getElementById('message')
    const send = document.getElementById('send')
    const sendDraft = document.getElementById('send-draft')
    const nativeFetch = window.fetch.bind(window)
    window.fetch = (inputValue, init = {}) => {
      const url = typeof inputValue === 'string' ? inputValue : inputValue?.url
      if (!url || !url.startsWith(coreUrl)) return nativeFetch(inputValue, init)
      const headers = new Headers(init.headers || {})
      headers.set('X-Meguri-Desktop-Client', 'airi')
      headers.set('X-Meguri-Desktop-Session', sessionId)
      return nativeFetch(inputValue, { ...init, headers })
    }
    const weatherText = document.getElementById('weather-text')
    const weatherName = document.getElementById('weather-name')
    const weatherLatitude = document.getElementById('weather-latitude')
    const weatherLongitude = document.getElementById('weather-longitude')
    const weatherTimezone = document.getElementById('weather-timezone')
    const sessionAuto = document.getElementById('session-auto')
    const sessionIdle = document.getElementById('session-idle')
    const sessionTurns = document.getElementById('session-turns')
    const sessionConfidence = document.getElementById('session-confidence')
    const sessionIdleValue = document.getElementById('session-idle-value')
    const sessionTurnsValue = document.getElementById('session-turns-value')
    const sessionConfidenceValue = document.getElementById('session-confidence-value')
    const trainingMode = document.getElementById('training-mode')
    const trainingNote = document.getElementById('training-note')
    const trainingCandidates = document.getElementById('training-candidates')
    const trainingFeedback = document.getElementById('training-feedback')
    const trainingFeedbackText = document.getElementById('training-feedback-text')
    const trainingFeedbackSubmit = document.getElementById('training-feedback-submit')
    const trainingFeedbackStatus = document.getElementById('training-feedback-status')
    const resourcePanel = document.getElementById('resource-panel')
    const resourceHint = document.getElementById('resource-hint')
    const resourceList = document.getElementById('resource-list')
    const resourceSelected = document.getElementById('resource-selected')
    // This legacy spike is retained for diagnostics only. The supported desktop
    // UI is AIRI Stage Tamagotchi, whose speech pipeline calls GPT-SoVITS.
    // Never fall back to the operating-system Web Speech voice here.
    let speechEnabled = false
    let weatherEnabled = false
    let lastRainKey = localStorage.getItem('meguri.weather.lastRainKey') || ''
    const weatherNoticeKey = 'meguri.weather.lastNoticeId'
    const dailyReportNoticeKey = 'meguri.dailyReport.lastId'
    let lastWeatherNoticeId = localStorage.getItem(weatherNoticeKey) || ''
    let lastDailyReportId = localStorage.getItem(dailyReportNoticeKey) || ''
    let lastTurnAt = Number(localStorage.getItem(lastTurnAtKey)) || 0
    let pendingSegment = null
    let sessionSettings = loadSessionSettings()
    let activeTrainingTurn = null
    let selectedTrainingCandidateId = null
    let pendingAttachments = []
    let activeResourceResolution = null
    let resourceSearchSequence = 0
    let resourceSearchTimer = null

    function loadSessionSettings() {
      try {
        const stored = JSON.parse(localStorage.getItem(sessionSettingsKey) || '{}')
        return {
          autoEnabled: stored.autoEnabled !== false,
          idleMinutes: Math.max(1, Math.min(120, Number(stored.idleMinutes) || 5)),
          observationTurns: Math.max(2, Math.min(6, Number(stored.observationTurns) || 3)),
          newTopicConfidence: Math.max(0.5, Math.min(0.95, Number(stored.newTopicConfidence) || 0.8)),
        }
      } catch { return { autoEnabled: true, idleMinutes: 5, observationTurns: 3, newTopicConfidence: 0.8 } }
    }
    function renderSessionSettings() {
      sessionAuto.checked = sessionSettings.autoEnabled
      sessionIdle.value = String(sessionSettings.idleMinutes)
      sessionTurns.value = String(sessionSettings.observationTurns)
      sessionConfidence.value = String(Math.round(sessionSettings.newTopicConfidence * 100))
      sessionIdleValue.textContent = sessionSettings.idleMinutes + ' min'
      sessionTurnsValue.textContent = sessionSettings.observationTurns + ' turns'
      sessionConfidenceValue.textContent = Math.round(sessionSettings.newTopicConfidence * 100) + '%'
    }
    function saveSessionSettings() {
      sessionSettings = {
        autoEnabled: sessionAuto.checked,
        idleMinutes: Number(sessionIdle.value),
        observationTurns: Number(sessionTurns.value),
        newTopicConfidence: Number(sessionConfidence.value) / 100,
      }
      localStorage.setItem(sessionSettingsKey, JSON.stringify(sessionSettings))
      renderSessionSettings()
    }

    function trainingModeEnabled() { return trainingMode.checked }
    function renderTrainingMode() {
      trainingNote.textContent = trainingModeEnabled()
        ? '双回答概率 3%，文字反馈已开启'
        : '双回答概率 0.1%，反馈框隐藏'
      trainingFeedback.hidden = !trainingModeEnabled()
      trainingFeedbackSubmit.disabled = trainingModeEnabled() && !activeTrainingTurn
      if (trainingModeEnabled() && !activeTrainingTurn) trainingFeedbackStatus.textContent = '发送一条消息后即可提交纠错说明。'
    }
    function resetTrainingPanel() {
      activeTrainingTurn = null
      selectedTrainingCandidateId = null
      trainingCandidates.replaceChildren()
      trainingCandidates.hidden = true
      trainingFeedbackText.value = ''
      trainingFeedbackStatus.textContent = ''
      trainingFeedback.hidden = true
    }
    function renderTrainingCandidates(comparison) {
      trainingCandidates.replaceChildren()
      const candidates = Array.isArray(comparison?.candidates) ? comparison.candidates : []
      trainingCandidates.hidden = candidates.length < 2
      for (const [index, candidate] of candidates.entries()) {
        const option = document.createElement('button')
        option.type = 'button'
        option.className = 'candidate-option'
        option.dataset.candidateId = candidate.candidate_id
        const label = document.createElement('span')
        label.className = 'candidate-label'
        label.textContent = '回答 ' + String.fromCharCode(65 + index)
        option.append(label, document.createTextNode(candidate.response?.reply || ''))
        option.addEventListener('click', async () => {
          selectedTrainingCandidateId = candidate.candidate_id
          for (const peer of trainingCandidates.querySelectorAll('.candidate-option')) {
            peer.classList.toggle('selected', peer.dataset.candidateId === selectedTrainingCandidateId)
          }
          bubble.textContent = candidate.response?.reply || ''
          updateLastMeguriLogText(bubble.textContent)
          applyExpression(candidate.response || {})
          if (!trainingModeEnabled()) await submitTrainingFeedback()
        })
        trainingCandidates.append(option)
      }
    }
    async function submitTrainingFeedback() {
      if (!activeTrainingTurn) return
      const feedbackText = trainingFeedbackText.value.trim()
      if (!selectedTrainingCandidateId && !feedbackText) {
        trainingFeedbackStatus.textContent = '请选择一个回答，或填写具体纠错说明。'
        return
      }
      trainingFeedbackSubmit.disabled = true
      trainingFeedbackStatus.textContent = '正在保存…'
      try {
        const response = await fetch(coreUrl + '/v1/training/feedback', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
            turn_id: activeTrainingTurn.turnId,
            selected_candidate_id: selectedTrainingCandidateId,
            feedback_text: feedbackText,
            consent_to_training: true,
          }),
        })
        if (!response.ok) throw new Error('training feedback ' + response.status)
        const saved = await response.json()
        trainingFeedbackStatus.textContent = '已保存为训练候选：' + saved.feedback_id
        trainingFeedbackText.value = ''
      } catch (reason) {
        trainingFeedbackStatus.textContent = '保存失败：' + (reason.message || String(reason))
      } finally {
        trainingFeedbackSubmit.disabled = false
      }
    }

    function updateSessionLabel() {
      sessionLabel.textContent = 'session: ' + sessionId.slice(-8) + ' (desktop)'
    }
    function startNewSession() {
      sessionId = newSessionId()
      pendingSegment = null
      localStorage.setItem(sessionStorageKey, sessionId)
      updateSessionLabel()

      chatLogEntries.push(record)

      chatLogList.append(renderLogEntry(record))

    }

    async function pollArtifacts() {

        const response = await nativeFetch('/artifacts/recent' + query, { cache: 'no-store' })
        if (!response.ok) return
        const feed = await response.json()
        if (!(artifactCursor > 0)) {
          // First run adopts the server clock so history is not replayed as new.
          artifactCursor = Number(feed.now) || Date.now()
          persistArtifactState()
          return
        }
        let changed = false
        for (const item of Array.isArray(feed.artifacts) ? feed.artifacts : []) {
          if (!item || typeof item.href !== 'string' || typeof item.local_path !== 'string') continue
          const seenKey = item.local_path + '|' + item.modified_ms
          if (artifactSeen.has(seenKey)) continue
          artifactSeen.add(seenKey)
          changed = true
          localPathByHref.set(item.href, item.local_path)
          if (Number(item.modified_ms) > artifactCursor) artifactCursor = Number(item.modified_ms)
          if (!recentlyAnnounced(item)) {
            markAnnounced(item)
            appendChatLog({
              role: 'file',
              text: '生成了新文件：' + item.name,
              artifacts: [{ label: item.name, href: item.href, local_path: item.local_path }],
            })
          }
          await showArtifactBubble(item)
        }
        if (changed) persistArtifactState()
      } catch {

      } finally {
        artifactPollBusy = false
      }

    function markAnnounced(item) {

    function resourceMarkerPresent(value) {

      if (!id || !name || !path) return null
      return {
        type: 'local_file_reference', source: 'everything', reference_id: id,
        name, path,
        kind: typeof candidate.kind === 'string' ? candidate.kind : 'file',
        size_bytes: Number.isFinite(candidate.size_bytes) ? candidate.size_bytes : null,
        modified_at: typeof candidate.modified_at === 'string' ? candidate.modified_at : null,

    async function attachDroppedResources(files) {
      const desktop = window.meguriDesktop
      if (!desktop?.getPathForFile) {
        resourcePanel.hidden = false
        resourceHint.textContent = '文件拖放仅在 Electron 桌宠窗口中可用；网页中请使用 @ 搜索。'
        return
      }
      const selected = Array.from(files || []).slice(0, 5)
      if (!selected.length) return
      resourcePanel.hidden = false
      resourceHint.textContent = '正在通过 Everything 校验拖入的资源…'
      setStatus('正在附加本地资源…', true)
      const rejected = []
      for (const file of selected) {
        const nativePath = desktop.getPathForFile(file)
        if (!nativePath || nativePath.length > 200) {
          rejected.push(file.name)
          continue
        }
        try {
          const exactQuery = '"' + nativePath.replaceAll('"', '') + '"'
          const response = await fetch(localCoreUrl + '/v1/resources/search?q=' + encodeURIComponent(exactQuery) + '&limit=20')
          if (!response.ok) throw new Error('resource search ' + response.status)
          const result = await response.json()
          const candidate = (Array.isArray(result.candidates) ? result.candidates : [])
            .find(item => sameWindowsPath(item.path, nativePath))
          const attachment = safeResourceAttachment(candidate)
          if (!attachment) {
            rejected.push(file.name)
            continue
          }
          if (!pendingAttachments.some(item => item.reference_id === attachment.reference_id)) {
            pendingAttachments.push(attachment)
          }
        } catch {
          rejected.push(file.name)
        }
      }
      activeResourceResolution = null
      resourceList.replaceChildren()
      renderResourceSelection()
      resourcePanel.hidden = false
      resourceHint.textContent = rejected.length
        ? '部分资源未通过允许目录或安全过滤：' + rejected.join('、')
        : '已附加资源元数据，未读取正文；确认后再发送。'
      if (!input.value.trim() && pendingAttachments.length) input.value = '请参考所选本地资源'
      setStatus(pendingAttachments.length ? '资源已附加，请确认后发送' : '没有可附加的安全资源')

    async function loadWeather(announce = false) {

    async function loadWeatherNotice() {

        const notice = await response.json()

        const createdAt = Date.parse(notice.created_at || '')
        const stale = Number.isFinite(createdAt) && Date.now() - createdAt > 90 * 60 * 1000

    async function loadDailyReportNotice() {

        const publishedAt = Date.parse(notice.published_at || '')
        const stale = !Number.isFinite(publishedAt) || Date.now() - publishedAt > 48 * 60 * 60 * 1000
        if (stale) {

          localStorage.setItem(dailyReportNoticeKey, lastDailyReportId)

        if (!deliveryText || deliveryText.length > 8000) return
        lastDailyReportId = notice.report_id
        localStorage.setItem(dailyReportNoticeKey, lastDailyReportId)

    function parseSseFrame(frame) {
      let eventName = ''
      const dataLines = []
      for (const line of frame.split(/\r?\n/)) {
        if (line.startsWith('event:')) eventName = line.slice(6).trim()
        else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart())
      }
      if (!eventName || dataLines.length === 0) return undefined
      try { return { eventName, envelope: JSON.parse(dataLines.join('\n')) } } catch { return undefined }
    }
    async function followTurn(turnId) {
      const response = await fetch(coreUrl + '/v1/sessions/' + encodeURIComponent(sessionId) + '/events?after_sequence=0', {
        headers: { Accept: 'text/event-stream' },
      })
      if (!response.ok || !response.body) throw new Error('SSE ' + response.status)
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''
      let terminal = false
      let comparison = null
      while (!terminal) {
        const { value, done } = await reader.read()
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done })
        const frames = buffer.split(/\r?\n\r?\n/)
        buffer = frames.pop() || ''
        for (const frame of frames) {
          const parsed = parseSseFrame(frame)
          if (!parsed || parsed.envelope.turn_id !== turnId) continue
          const data = parsed.envelope.data || {}
          if (parsed.eventName === 'tool.started' && data.tool_name === 'web_search') setStatus('正在联网搜索…', true)
          if (parsed.eventName === 'tool.completed' && data.tool_name === 'web_search' && data.status === 'ok') setStatus('已完成联网搜索，正在整理…', true)
          if (parsed.eventName === 'training.candidates.ready') comparison = data
          if (parsed.eventName === 'text.delta') bubble.textContent += data.delta || ''
          if (parsed.eventName === 'text.completed' && !bubble.textContent) bubble.textContent = data.text || ''
          if (parsed.eventName === 'tts.requested') speakText(data.text || '', data.voice_style || 'neutral')
          if (parsed.eventName === 'semantic.completed' || parsed.eventName === 'expression.cue' || parsed.eventName === 'sprite.resolved') applyExpression(data)
          terminal = ['turn.completed', 'turn.cancelled', 'turn.failed'].includes(parsed.eventName)
        }
        if (done) break
      }
      if (!terminal) throw new Error('SSE 在终止事件前关闭')
      return comparison
    }
    async function checkCore() {
      try {
        const response = await fetch(coreUrl + '/health')
        if (!response.ok) throw new Error('health ' + response.status)
        const data = await response.json()
        setStatus('Java + DeepSeek ready')
        build.textContent = 'build: ' + data.build_id + ' · RAG ' + data.rag_chunks
      } catch (reason) {
        setStatus('Java runtime offline')
        error.textContent = '无法连接 Java Core（18080）：' + reason.message
      }
    }
    async function sendMessage(message, attachments = pendingAttachments.slice()) {
      error.textContent = ''
      send.disabled = true
      setStatus('Meguri is thinking…', true)
      bubble.textContent = ''
      resetTrainingPanel()
      prepareAutomaticSegment()
      // 附件元数据同时写入消息文本：即使远端 Core 版本较旧、丢弃 attachments 字段，
      // 模型也能看到引用的文件名（仅元数据，正文未读取）。
      const outgoingMessage = attachments.length
        ? message + '\n\n[本地资源引用（仅文件名等元数据，内容未读取）：'
          + attachments.map(item => item.name + (item.kind === 'directory' ? '（文件夹）' : '')).join('、') + ']'
        : message
      const request = {
        user_id: userId, client_id: 'airi', session_id: sessionId, message: outgoingMessage,
        parent_session_id: pendingSegment?.parentSessionId || null,
        attachments,
        client_capabilities: { text: true, sprite: true, voice: speechEnabled, screen_context: false },
        formal_memory_allowed: false,
        training_mode: trainingModeEnabled(),
      }
      try {
        const createdResponse = await fetch(coreUrl + '/v1/turns', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Idempotency-Key': 'desktop-' + Date.now() }, body: JSON.stringify(request),
        })
        if (!createdResponse.ok) throw new Error('turn ' + createdResponse.status)
        const created = await createdResponse.json()
        const sentIds = new Set(attachments.map(item => item.reference_id))
        pendingAttachments = pendingAttachments.filter(item => !sentIds.has(item.reference_id))
        activeResourceResolution = null
        resourceList.replaceChildren()
        resourceHint.textContent = ''
        renderResourceSelection()
        const comparison = await followTurn(created.turn_id)
        appendChatLog({ role: 'meguri', text: bubble.textContent })
        void pollArtifacts()
        activeTrainingTurn = { turnId: created.turn_id, userMessage: message, comparison }
        if (comparison) renderTrainingCandidates(comparison)
        if (trainingModeEnabled()) {
          trainingFeedback.hidden = false
          trainingFeedbackSubmit.disabled = false
          trainingFeedbackStatus.textContent = ''
        }
        if (pendingSegment) {
          pendingSegment.userTurns += 1
          await finalizeAutomaticSegment()
        }
        lastTurnAt = Date.now()
        localStorage.setItem(lastTurnAtKey, String(lastTurnAt))
        send.disabled = false
        setStatus('Java + DeepSeek ready')
      } catch (reason) {
        send.disabled = false; setStatus('Java runtime ready'); error.textContent = reason.message || String(reason)
      }
    }
    async function resolveInput(message) {
      const response = await fetch(coreUrl + '/v1/input/resolve', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }),
      })
      if (!response.ok) throw new Error('input resolve ' + response.status)
      return response.json()
    }
    async function handleInput(message) {
      error.textContent = ''
      send.disabled = true
      setStatus('正在识别输入…', true)
      try {
        const resolved = await resolveInput(message)
        if (resolved.kind === 'normal' || typeof resolved.command === 'string') {
          const attachmentNote = resolved.kind === 'normal' && pendingAttachments.length
            ? '\n📎 ' + pendingAttachments.map(item => item.name).join('、')
            : ''
          appendChatLog({ role: 'user', text: (resolved.kind === 'normal' ? resolved.message : message.trim()) + attachmentNote })
        }
        if (resolved.kind === 'normal') {
          input.value = ''
          sendDraft.hidden = true
          await sendMessage(resolved.message)
          return
        }
        if (resolved.kind === 'preprocess') {
          bubble.textContent = resolved.preview
          input.value = resolved.message
          sendDraft.hidden = false
          send.disabled = false
          setStatus('工程草稿已生成，请确认后发送')
          return
        }
        if (resolved.kind === 'resource') {
          send.disabled = false
          sendDraft.hidden = true
          await showResourceSelector(resolved)
          return
        }
        if (resolved.kind === 'error') {
          bubble.textContent = resolved.error
          send.disabled = false
          setStatus('等待输入')
          return
        }
        if (resolved.command === 'help') {
          bubble.textContent = '快捷指令：\n#天气  查询已保存地点的天气\n#账单  查看钱迹同步后的安全日报\n#视频日报  汇总昨天完整日的 Bilibili 账号观看历史元数据（账号源不可用时明确降级浏览器访问记录）\n#搜索 关键词  联网检索并整理\n#帮助  查看说明\n\n@文件名  通过 Everything 选择本地资源（只引用元数据，不读取正文）\nElectron 桌宠也可直接拖入文件，仍会经过相同安全校验并要求确认发送。\n正文中可写 @文件名、@{带空格的名称} 或 @"带空格的名称"。\n@@文字  输入普通的 @文字。\n~工程任务  生成可编辑的工程任务草稿。\n\n新生成的报告会出现在聊天记录里，并以图标泡泡浮在桌宠旁，点击即可用默认应用打开。'
          appendChatLog({ role: 'meguri', text: bubble.textContent })
          input.value = ''
          sendDraft.hidden = true
          send.disabled = false
          setStatus('快捷指令完成')
          return
        }
        if (resolved.command === 'weather') {
          input.value = ''
          sendDraft.hidden = true
          const briefing = await loadWeather(true)
          bubble.textContent = briefing?.briefing || weatherText.textContent || '实时天气暂时不可用。'
          appendChatLog({ role: 'meguri', text: bubble.textContent })
          send.disabled = false
          setStatus('天气快捷指令完成')
          return
        }
        if (resolved.command === 'billing') {
          input.value = ''
          sendDraft.hidden = true
          const response = await fetch(coreUrl + '/v1/daily/billing/briefing')
          if (!response.ok) throw new Error('billing ' + response.status)
          const data = await response.json()
          showBubble(data.briefing || data.error || 'Billing daily report is not available.', data.artifacts)
          void pollArtifacts()
          if (data.briefing) speakText(data.briefing, 'soft')
          send.disabled = false
          setStatus(data.status === 'ready' ? '账单日报已读取' : '账单日报暂不可用')
          return
        }
        if (resolved.command === 'bilibili') {
          input.value = ''
          sendDraft.hidden = true
          setStatus('正在读取 Bilibili 观看历史元数据…', true)
          try {
            const response = await fetch(coreUrl + '/v1/daily/bilibili/briefing')
            if (!response.ok) throw new Error('bilibili report ' + response.status)
            const data = await response.json()
            const syncNote = data.sync_status && data.sync_status !== 'success'
              ? '同步状态：' + data.sync_status + '（可读旧数据不代表本次同步成功）'
              : ''
            const text = [data.summary || data.error || '今天没有可报告的 Bilibili 观看历史。', syncNote, data.boundary]
              .filter(Boolean).join('\n\n')
            showBubble(text, data.artifacts)
            void pollArtifacts()
            if (data.data_source === 'account_mcp') {
              setStatus(data.status === 'ready' ? '账号观看日报已生成' : '账号观看日报暂无内容')
            } else {
              setStatus(data.status === 'ready' ? '浏览器降级日报已生成' : '视频日报暂无内容')
            }
          } catch (reason) {
            bubble.textContent = '视频访问日报生成失败：' + (reason.message || String(reason))
            setStatus('视频访问日报生成失败')
          } finally {
            send.disabled = false
          }
          return
        }
        if (resolved.command === 'search') {
          input.value = ''
          sendDraft.hidden = true
          await sendMessage('联网搜索 ' + resolved.arguments)
          return
        }
        throw new Error('unsupported command')
      } catch (reason) {
        send.disabled = false
        setStatus('输入处理失败')
        error.textContent = reason.message || String(reason)
      }
    }
    document.getElementById('form').addEventListener('submit', event => {
      event.preventDefault()
      const message = input.value
      if ((!message.trim() && !pendingAttachments.length) || send.disabled) return
      handleInput(message)
    })
    sendDraft.addEventListener('click', () => {
      const message = input.value.trim()
      if (!message || send.disabled) return
      appendChatLog({ role: 'user', text: message })
      input.value = ''
      sendDraft.hidden = true
      sendMessage(message)
    })
    input.addEventListener('input', () => {
      clearTimeout(resourceSearchTimer)
      if (!resourceMarkerPresent(input.value)) {
        activeResourceResolution = null
        resourceList.replaceChildren()
        if (pendingAttachments.length) resourceHint.textContent = '已引用元数据，未读取文件正文'
        renderResourceSelection()
        return
      }
      resourceSearchTimer = setTimeout(async () => {
        try {
          const resolved = await resolveInput(input.value)
          if (resolved.kind === 'resource') await showResourceSelector(resolved)
        } catch (reason) {
          resourcePanel.hidden = false
          resourceHint.textContent = '无法连接本地资源搜索：' + (reason.message || String(reason))
        }
      }, 180)
    })
    document.getElementById('weather-form').addEventListener('submit', async event => {
      event.preventDefault()
      try {
        if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission()
        const response = await fetch(coreUrl + '/v1/daily/weather/location', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
            name: weatherName.value.trim(), latitude: Number(weatherLatitude.value),
            longitude: Number(weatherLongitude.value), timezone: weatherTimezone.value.trim(),
          }),
        })
        if (!response.ok) throw new Error('保存失败 ' + response.status)
        await loadWeather(true)
      } catch (reason) {
        weatherText.textContent = '天气地点保存失败：' + (reason.message || String(reason))
      }
    })
    const newSessionButton = document.createElement('button')
    newSessionButton.type = 'button'
    newSessionButton.className = 'secondary'
    newSessionButton.textContent = '新建会话'
    newSessionButton.addEventListener('click', startNewSession)
    document.querySelector('.meta').append(newSessionButton)
    sessionAuto.addEventListener('change', saveSessionSettings)
    sessionIdle.addEventListener('input', saveSessionSettings)
    sessionTurns.addEventListener('input', saveSessionSettings)
    sessionConfidence.addEventListener('input', saveSessionSettings)
    trainingMode.checked = localStorage.getItem(trainingModeKey) === 'true'
    trainingMode.addEventListener('change', () => {
      localStorage.setItem(trainingModeKey, String(trainingModeEnabled()))
      renderTrainingMode()
    })
    trainingFeedbackSubmit.addEventListener('click', submitTrainingFeedback)
    const chatPanel = document.querySelector('.chat')
    // 整个窗口都是拖放区：拖到立绘或聊天面板上都能附加文件（原先只有聊天面板可放）。
    for (const eventName of ['dragenter', 'dragover']) {
      document.addEventListener(eventName, event => {
        if (!event.dataTransfer?.types?.includes('Files')) return
        event.preventDefault()
        event.dataTransfer.dropEffect = 'copy'
        chatPanel.classList.add('dragging-resource')
      })
    }
    for (const eventName of ['dragleave', 'dragend']) {
      document.addEventListener(eventName, event => {
        if (event.relatedTarget) return
        chatPanel.classList.remove('dragging-resource')
      })
    }
    document.addEventListener('drop', event => {
      event.preventDefault()
      chatPanel.classList.remove('dragging-resource')
      if (!event.dataTransfer?.types?.includes('Files')) return
      attachDroppedResources(event.dataTransfer.files)
    })
    // 复制文件后 Ctrl+V 粘贴，同样经过与拖放一致的 Everything 安全校验。
    document.addEventListener('paste', event => {
      const files = event.clipboardData?.files
      if (files?.length) attachDroppedResources(files)
    })
    renderSessionSettings()
    renderTrainingMode()
    updateSessionLabel()
    renderChatLog()
    checkCore()
    loadWeather(true).finally(loadDailyReportNotice)
    loadWeatherNotice()
    void pollArtifacts()
    // Poll unconditionally so startup while Core is offline does not permanently disable reconnect.
    setInterval(() => loadWeather(false), 15 * 60 * 1000)
    setInterval(loadWeatherNotice, 60 * 1000)
    setInterval(loadDailyReportNotice, 60 * 1000)
    setInterval(pollArtifacts, 20 * 1000)
  </script>
</body>
</html>
